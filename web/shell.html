<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGUI</title>
<style>
html, body { margin: 0; height: 100%; background: #181a1e; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; outline: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #c8ccd4; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
var Module = {
  canvas: document.getElementById('canvas'),
  setStatus: function (text) {
    var status = document.getElementById('status');
    if (text) { status.textContent = text; status.style.display = 'flex'; }
    else { status.style.display = 'none'; }
  },
  onAbort: function () { Module.setStatus('The page crashed. Reload to try again.'); }
};
</script>
{{{ SCRIPT }}}
</body>
</html>
